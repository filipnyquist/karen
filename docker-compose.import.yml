# docker-compose.import.yml
#
# Manual, opt-in flow for importing legacy pykaren (MySQL) data into the
# Karen (Postgres) database. Brings up a MySQL container with the dump
# auto-loaded into a fresh volume, then runs the importer once and tears
# down.
#
# Run from the project root, with karen_dump.sql already in place:
#
#   docker compose -f docker-compose.dev.yml up --build       # db + migrate + app
#   docker compose -f docker-compose.import.yml up legacy-import
#   docker compose -f docker-compose.import.yml down           # tears down legacy-db
#
# The importer joins the same `karen-net` network as the dev/prod stack
# so it can reach `db:5432` regardless of cwd.
#
# ⚠  `docker compose -f docker-compose.import.yml down -v` wipes
#    `legacy_db_data` (the loaded MySQL data). Don't run that until
#    you've confirmed the import succeeded.

services:
  # Legacy MySQL database (old pykaren data). The dump is bind-mounted
  # into /docker-entrypoint-initdb.d/ and auto-loaded on first start of
  # an empty volume. Cold-start loading of a 75 MB dump routinely takes
  # 30–60 s — start_period below absorbs that.
  legacy-db:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=karen
      - MARIADB_USER=karen
      - MARIADB_PASSWORD=karen
    volumes:
      - legacy_db_data:/var/lib/mysql
      - ./karen_dump.sql:/docker-entrypoint-initdb.d/01-dump.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # One-shot importer: reads from legacy-db (MySQL), writes to db (Postgres).
  # Pre-flight: the dev/prod `db` container must already be running and
  # migrations must have been applied (the dev stack's `migrate` service
  # does this on first `up`). The importer does not retry; it exits non-zero
  # on any DB error so you notice.
  legacy-import:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Reads ENCRYPTION_KEY from .env (required by guest-SSN HMAC hashing
    # during the legacy import). DATABASE_URL + LEGACY_DATABASE_URL are
    # set explicitly below and override anything in .env.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://karen:karen@db:5432/karen
      - LEGACY_DATABASE_URL=mysql://karen:karen@legacy-db:3306/karen
    command: ["bun", "src/db/import-legacy.ts"]
    depends_on:
      legacy-db:
        condition: service_healthy
    restart: "no"

volumes:
  legacy_db_data:

# Attach to the prod `traefik-network` so the importer can reach the
# prod `db` (postgres) by service name. The dev stack uses `karen-net`
# so if you're running the import against the dev stack, override this
# to `karen-net` instead. `external: true` is required because the
# prod stack already created `traefik-network` (see CLAUDE.md).
networks:
  default:
    name: traefik-network
    external: true
