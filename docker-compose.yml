services:
  app:
    build: .
    # Traefik routes karen.nyqui.st -> :3000 via traefik-network. The 3000:3000
    # host publish below stays as a fallback for direct access when Traefik is
    # down; Traefik itself never uses it (it talks to containers on
    # traefik-network by container name + container port).
    ports:
      - "3000:3000"
    # DATABASE_SSL=disable is required: the release image bakes
    # NODE_ENV=production, which makes the postgres-js driver require
    # TLS by default. The postgres container is reachable only on the
    # internal karen-net bridge and does not have TLS configured.
    environment:
      - DATABASE_URL=postgresql://karen:karen@db:5432/karen
      - DATABASE_SSL=disable
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@karen.se}
      - BASE_URL=${BASE_URL:-https://karen.nyqui.st}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - SESSION_MAX_AGE_MS=${SESSION_MAX_AGE_MS:-2592000000}
      - DEFAULT_MAX_GUESTS=${DEFAULT_MAX_GUESTS:-50}
      - DEFAULT_MAX_GUESTS_PER_USER=${DEFAULT_MAX_GUESTS_PER_USER:-3}
      - TURNSTILE_SITEKEY=${TURNSTILE_SITEKEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - UPLOAD_DIR=/app/uploads
    # app lives on BOTH karen-net (to reach db:5432) and traefik-network
    # (so Traefik can discover and route to it). db + migrate stay on
    # karen-net only — they don't need to be reached from the proxy.
    networks:
      - default
      - traefik
    # Traefik labels — pattern matches karen3/docker-compose.yml so the
    # Karen instance sits in the same Traefik routing topology as the
    # other services on this host (vaultwarden, portainer, photoprism...).
    # Letsencrypt resolves certs automatically; compresstraefik turns on
    # gzip on the way out.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.karen.rule=Host(`karen.nyqui.st`)"
      - "traefik.http.routers.karen.service=karen"
      - "traefik.http.routers.karen.entrypoints=websecure"
      - "traefik.http.routers.karen.tls=true"
      - "traefik.http.routers.karen.tls.certresolver=letsencrypt"
      - "traefik.http.routers.karen.middlewares=compresstraefik"
      - "traefik.http.middlewares.compresstraefik.compress=true"
      - "traefik.http.services.karen.loadbalancer.server.port=3000"
      - "traefik.http.services.karen.loadbalancer.passhostheader=true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=karen
      - POSTGRES_PASSWORD=karen
      - POSTGRES_DB=karen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Run migrations + seed on first start
  migrate:
    build: .
    # Reads ADMIN_PASSWORD + SUPERADMIN_PASSWORD from .env (required by
    # src/db/seed.ts via src/config.ts:67-68). DATABASE_URL is set
    # explicitly below and overrides anything in .env.
    env_file:
      - .env
    # Same DATABASE_SSL rationale as app — see comment above.
    environment:
      - DATABASE_URL=postgresql://karen:karen@db:5432/karen
      - DATABASE_SSL=disable
    command: ["sh", "-c", "bun db:migrate && bun db:seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Legacy importer (opt-in profile: "import"). Brings up an isolated MariaDB
  # with the pykaren dump auto-loaded on first start, runs the TypeScript
  # importer once, and exits. The importer reads from legacy-db (MySQL) and
  # writes to db (Postgres) over the shared karen-net.
  #
  # Usage (operator runs these manually — NOT part of `up`/`down`):
  #
  #   1. Place `karen_dump.sql` at the project root.
  #   2. Make sure the prod `db` is up and migrated
  #      (`docker compose up -d db app`).
  #   3. Run the importer:
  #        docker compose --profile import up legacy-import
  #        # legacy-db starts, the dump loads (~30-60 s on cold volume),
  #        # legacy-import waits for legacy-db healthcheck, runs once,
  #        # exits 0 on success. legacy-import has `restart: "no"`.
  #   4. Tear down the import side (KEEPS prod running):
  #        docker compose stop legacy-db legacy-import
  #        docker compose rm -f legacy-db legacy-import
  #        # ⚠ DO NOT use `docker compose --profile import down` — it
  #        # looks like it would only touch the profiled services, but
  #        # `down` ignores profiles and tears down the entire compose
  #        # project (app, db, network, etc). Use `stop` + `rm` for the
  #        # two legacy containers specifically. pgdata is untouched.
  #
  # Credentials mirror the prod db (karen:karen) so the importer can resolve
  # `db:5432` on karen-net. DATABASE_SSL=disable is required because the
  # release image bakes in NODE_ENV=production and the postgres driver
  # defaults to SSL=require in production. ENCRYPTION_KEY comes from .env
  # via env_file (the image excludes .env via .dockerignore).
  # ---------------------------------------------------------------------------
  legacy-db:
    image: mariadb:11
    profiles: ["import"]
    networks:
      - default
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=karen
      - MARIADB_USER=karen
      - MARIADB_PASSWORD=karen
    volumes:
      - legacy_db_data:/var/lib/mysql
      - ./karen_dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  legacy-import:
    build: .
    profiles: ["import"]
    networks:
      - default
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://karen:karen@db:5432/karen
      - DATABASE_SSL=disable
      - LEGACY_DATABASE_URL=mysql://karen:karen@legacy-db:3306/karen
    command: ["bun", "src/db/import-legacy.ts"]
    depends_on:
      legacy-db:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  uploads:
  legacy_db_data:

# Two networks:
# - `default` (karen-net): the historical project-internal network. db +
#   app + migrate + legacy-db + legacy-import all join it so `db:5432`
#   resolves inside this compose and so dev compose can join it too.
# - `traefik` (traefik-network): the host-wide Traefik routing network.
#   `app` joins it so Traefik 3.6.9 (running on this host) can route
#   karen.nyqui.st -> karen-app-1:3000. `external: true` because the
#   Traefik stack already created this network before Karen did.
networks:
  default:
    name: karen-net
  traefik:
    external: true
    name: traefik-network
